name: Test

on:
  push:
    branches: [beta, colosseum]
  pull_request:
    branches: [beta, colosseum]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OldSchoolSDK/osrs-sdk
          ref: feat/cache-render-bundle
          path: .beta-sdk
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Test native scenery extraction and lighting
        run: node --test scripts/ocellus-native-foundation.test.mjs scripts/ocellus-native-surface.test.mjs scripts/ocellus-object-lighting.test.mjs scripts/patch-ocellus-camera.test.mjs scripts/patch-ocellus-bossbar.test.mjs scripts/patch-ocellus-object-lighting.test.mjs scripts/patch-ocellus-viewport.test.mjs scripts/patch-ocellus-instanced-frames.test.mjs scripts/patch-ocellus-animation-cycles.test.mjs scripts/patch-ocellus-frame-sound-cycles.test.mjs scripts/patch-ocellus-minimap.test.mjs scripts/patch-ocellus-attached-textures.test.mjs scripts/patch-ocellus-actor-lifetime.test.mjs scripts/patch-ocellus-actor-presentation.test.mjs scripts/patch-ocellus-boss-alpha.test.mjs scripts/patch-ocellus-hitsplats.test.mjs scripts/patch-ocellus-texture-sampling.test.mjs scripts/audit-ocellus-native-actors.test.mjs scripts/audit-ocellus-spot-assets.test.mjs scripts/ocellus-backdrop.test.mjs scripts/audit-ocellus-collapse.test.mjs
      - name: Build beta SDK packages
        working-directory: .beta-sdk
        run: |
          npm ci
          npm run build
          npm pack --pack-destination "${RUNNER_TEMP}" --silent
          npm pack --workspace osrs-sdk-assets --pack-destination "${RUNNER_TEMP}" --silent
          npm pack --workspace osrs-sdk-react --pack-destination "${RUNNER_TEMP}" --silent
      - name: Install beta SDK packages
        run: |
          SDK_VERSION="$(node -p "require('./.beta-sdk/package.json').version")"
          REACT_VERSION="$(node -p "require('./.beta-sdk/packages/osrs-sdk-react/package.json').version")"
          npm install --no-save "@types/node@16.4.0" \
            "${RUNNER_TEMP}/osrs-sdk-${SDK_VERSION}.tgz" \
            "${RUNNER_TEMP}/osrs-sdk-assets-${SDK_VERSION}.tgz" \
            "${RUNNER_TEMP}/osrs-sdk-react-${REACT_VERSION}.tgz"
      - run: npm test -- --runInBand
      - name: Type-check Sol with its existing ES5 target
        run: npx tsc --noEmit --skipLibCheck
      - name: Type-check Ocellus with its ES2019 build profile
        run: npx tsc --project tsconfig.ocellus.json --noEmit --skipLibCheck
