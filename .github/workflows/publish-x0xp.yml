name: Build and deploy Sol Heredit Trainer

on:
  push:
    branches: [colosseum]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sol-trainer-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out trainer source
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build trainer and OSRS assets
        env:
          OSRS_SDK_REPO: https://github.com/OldSchoolSDK/osrs-sdk.git
          OSRS_SDK_BRANCH: feat/cache-render-bundle
          OSRS_CACHE_READER_REPO: https://github.com/Supalosa/osrscachereader.git
          OSRS_CACHE_READER_BRANCH: beta
          OSRS_ASSET_BASE_URL: https://assets-soltrainer.netlify.app
          NETLIFY_CACHE_DIR: /tmp/sol-trainer-build-cache
          COMMIT_REF: x0xp-fork
          BUILD_DATE: "2026-11-09"
          DEPLOY_URL: https://x0xp.github.io/ColosseumTrainer/
        run: |
          set -euo pipefail
          bash scripts/build-beta.sh
          test -s dist/index.html
          test -s dist/main.js
          test -s dist/osrs-assets/manifest.json
          touch dist/.nojekyll
          echo "Completed build with $(find dist -type f | wc -l) files."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
