name: Build and deploy Sol and Ocellus trainers

on:
  push:
    branches: [colosseum]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sol-and-ocellus-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out the exact requested unified trainer revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build trainer and OSRS assets
        env:
          OSRS_SDK_REPO: https://github.com/OldSchoolSDK/osrs-sdk.git
          OSRS_SDK_BRANCH: feat/cache-render-bundle
          OSRS_CACHE_READER_REPO: https://github.com/Supalosa/osrscachereader.git
          OSRS_CACHE_READER_BRANCH: beta
          OSRS_ASSET_BASE_URL: https://assets-soltrainer.netlify.app
          NETLIFY_CACHE_DIR: /tmp/sol-trainer-build-cache
          COMMIT_REF: x0xp-fork
          BUILD_DATE: "2026-11-09"
          DEPLOY_URL: https://x0xp.github.io/ColosseumTrainer/
        run: |
          set -euo pipefail
          bash scripts/build-beta.sh
          test -s dist/index.html
          test -s dist/main.js
          test -s dist/osrs-assets/manifest.json
          touch dist/.nojekyll
          echo "Completed build with $(find dist -type f | wc -l) files."

      - name: Preserve the Sol build before compiling Ocellus
        run: |
          mkdir -p "${RUNNER_TEMP}/sol-dist"
          cp -a dist/. "${RUNNER_TEMP}/sol-dist/"

      - name: Use Node.js 22 for Ocellus
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build and browser-test Ocellus from the main checkout
        env:
          OSRS_SDK_REPO: https://github.com/Julian-Dasilva/osrs-sdk.git
          OSRS_SDK_COMMIT: 9995966c094c4cd18ab8b05038c9890ab95a189f
          OSRS_CACHE_READER_REPO: https://github.com/Julian-Dasilva/osrscachereader.git
          OSRS_CACHE_READER_COMMIT: 8ba9131f1afd1193e7c6180db5a895ffe9e21fa8
          NETLIFY_CACHE_DIR: /tmp/ocellus-pages-build-cache
          COMMIT_REF: ocellus-live-preview
          BUILD_DATE: "2026-11-15"
          DEPLOY_URL: https://x0xp.github.io/ColosseumTrainer/ocellus/
        run: |
          set -euo pipefail
          bash scripts/build-ocellus.sh
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/ocellus-source-revision.txt
          node scripts/smoke-ocellus.mjs
          test -s dist/index.html
          test -s dist/main.js
          test -s dist/osrs-assets/manifest.json

      - name: Retain Chromium Ocellus captures from the main build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocellus-main-build-visuals
          path: |
            artifacts/ocellus-first-mark.png
            artifacts/ocellus-first-transition.png
            artifacts/ocellus-outer-void.png
            artifacts/ocellus-after-outer.png
            artifacts/ocellus-rift-tick-*.png
            artifacts/ocellus-source-revision.txt
            artifacts/ocellus-visual-frames.json
            artifacts/ocellus-scenery/
          if-no-files-found: ignore
          retention-days: 14

      - name: Record source revision for the visual evidence and deployment
        run: |
          cp artifacts/ocellus-source-revision.txt dist/ocellus-source-revision.txt
          cp dist/ocellus-source-revision.txt "${RUNNER_TEMP}/sol-dist/source-revision.txt"

      - name: Package both trainers into the single live Pages site
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/sol-dist/ocellus"
          cp -a dist/. "${RUNNER_TEMP}/sol-dist/ocellus/"
          rm -rf dist
          mv "${RUNNER_TEMP}/sol-dist" dist
          test -s dist/main.js
          test -s dist/index.html
          test -s dist/ocellus/index.html
          test -s dist/ocellus/main.js
          test -s dist/ocellus/osrs-assets/manifest.json
          touch dist/.nojekyll
          echo "Live Pages bundle: Sol + Ocellus; $(find dist -type f | wc -l) files."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
